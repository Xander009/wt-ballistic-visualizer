[package]
name = "wtv"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
flate2 = "1.1.11"
gpui = { version = "0.3.12", package = "gpui-pre" }
gpui-component = "0.9.1"
gpui_platform = { version = "=0.3.12", package = "gpui-pre-platform" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
liblzma = { version = "0.4.9", default-features = false, features = ["static"] }
pollster = "1.0.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
wgpu = "30.0.1"
